<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证书查询系统</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            }
            .transition-all-300 {
                transition: all 0.3s ease;
            }
            .scale-on-hover:hover {
                transform: scale(1.02);
            }
            .certificate-container {
                perspective: 1000px;
            }
            .certificate-inner {
                transition: transform 0.6s;
                transform-style: preserve-3d;
            }
            .certificate-container:hover .certificate-inner {
                transform: rotateY(10deg);
            }
            .certificate-zoom {
                transition: transform 0.3s ease;
            }
            .certificate-zoom:hover {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- 页面容器 -->
    <div class="min-h-screen flex flex-col">
        <!-- Banner 区域 -->
        <header class="w-full">
            <div class="relative">
                <img src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/acc330daf20b419c86f187335f554dbf~tplv-a9rns2rl98-image.image?rcl=202511201851033C72AAF7E2170FEF3904&rk3s=8e244e95&rrcfp=f06b921b&x-expires=1766227877&x-signature=J5WrvJv5tCgAkGHN59fx6M%2F0MQQ%3D" 
                     alt="证书查询系统" 
                     class="w-full h-auto object-cover">
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="flex-grow container mx-auto px-4 py-8">
            <!-- 标题区域 -->
            <div class="text-center mb-12">
                <h1 class="text-3xl md:text-4xl font-bold text-primary mb-2">证书下载入口</h1>
                <p class="text-neutral-dark max-w-2xl mx-auto">请输入您的个人信息查询并下载证书</p>
            </div>

            <!-- 查询表单区域 -->
            <div class="max-w-md mx-auto bg-white rounded-lg shadow-card p-6 md:p-8 mb-12 transition-all-300 scale-on-hover">
                <form id="queryForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-user"></i>
                            </span>
                            <input type="text" id="name" name="name" required
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="请输入您的姓名">
                        </div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-phone"></i>
                            </span>
                            <input type="tel" id="phone" name="phone" required
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="请输入您的手机号" pattern="^1[3-9]\d{9}$"
                                onblur="validatePhone()"
                                onfocus="this.classList.remove('border-red-500')">
                        </div>
                        <p id="phoneError" class="mt-1 text-red-500 text-sm hidden">请输入正确的手机号</p>
                    </div>

                    <div>
                        <button type="submit" id="queryBtn" 
                            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-md transition-all-300 flex items-center justify-center">
                            <i class="fa fa-search mr-2"></i> 查看证书
                        </button>
                    </div>
                </form>
            </div>

            <!-- 证书展示区域 -->
            <div id="certificateSection" class="max-w-4xl mx-auto hidden">
                <div class="bg-white rounded-lg shadow-card overflow-hidden">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-2xl font-bold text-primary flex items-center">
                            <i class="fa fa-certificate mr-2"></i> 证书信息
                        </h2>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <!-- 证书预览 -->
                        <div class="certificate-container mb-8 flex justify-center">
                            <div class="certificate-inner relative w-full max-w-2xl overflow-hidden rounded-lg shadow-lg">
                                <div class="certificate-zoom overflow-hidden">
                                    <img id="certificateImage" src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/94ca4d9bfee54e1a83d249c5000609a8~tplv-a9rns2rl98-image.image?rcl=202511201851033C72AAF7E2170FEF3904&rk3s=8e244e95&rrcfp=f06b921b&x-expires=1766227893&x-signature=s%2FlQOMwaoI%2FowcXLDaxkiQRWJQM%3D" 
                                         alt="证书预览" 
                                         class="w-full h-auto">
                                </div>
                                <div class="absolute inset-0 bg-black bg-opacity-10 flex items-center justify-center opacity-0 hover:opacity-100 transition-all-300">
                                    <span class="text-white text-lg font-medium">
                                        <i class="fa fa-search-plus mr-2"></i> 点击放大查看
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- 证书信息 -->
                        <div class="bg-neutral rounded-lg p-6 mb-6">
                            <h3 class="text-lg font-semibold text-gray-800 mb-4">证书详情</h3>
                            <div class="space-y-3">
                                <div class="flex flex-col md:flex-row md:items-center">
                                    <span class="text-gray-600 w-24">姓名：</span>
                                    <span id="certName" class="font-medium">张三</span>
                                </div>
                                <div class="flex flex-col md:flex-row md:items-center">
                                    <span class="text-gray-600 w-24">证书类型：</span>
                                    <span id="certType" class="font-medium">专业技能认证证书</span>
                                </div>
                                <div class="flex flex-col md:flex-row md:items-center">
                                    <span class="text-gray-600 w-24">颁发日期：</span>
                                    <span id="certDate" class="font-medium">2025年6月15日</span>
                                </div>
                                <div class="flex flex-col md:flex-row md:items-center">
                                    <span class="text-gray-600 w-24">证书编号：</span>
                                    <span id="certNumber" class="font-medium">Cert20250615001</span>
                                </div>
                            </div>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button id="downloadBtn" 
                                class="flex-1 bg-secondary hover:bg-secondary/90 text-white font-medium py-3 px-4 rounded-md transition-all-300 flex items-center justify-center">
                                <i class="fa fa-download mr-2"></i> 下载证书
                            </button>
                            <button id="printBtn" 
                                class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 px-4 rounded-md transition-all-300 flex items-center justify-center">
                                <i class="fa fa-print mr-2"></i> 打印证书
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 无证书提示 -->
            <div id="noCertificateSection" class="max-w-md mx-auto bg-white rounded-lg shadow-card p-6 md:p-8 text-center hidden">
                <div class="text-6xl text-neutral-dark mb-4">
                    <i class="fa fa-exclamation-circle"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">未找到证书</h2>
                <p class="text-gray-600 mb-6">根据您提供的信息，未查询到相关证书。请检查您的信息是否正确，或联系客服获取帮助。</p>
                <button id="retryBtn" 
                    class="bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-md transition-all-300">
                    重新查询
                </button>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script>
        // 模拟证书数据
        const certificateData = {
            "张三": {
                "phone": "13800138000",
                "name": "张三",
                "type": "专业技能认证证书",
                "date": "2025年6月15日",
                "number": "Cert20250615001",
                "image": "https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/94ca4d9bfee54e1a83d249c5000609a8~tplv-a9rns2rl98-image.image?rcl=202511201851033C72AAF7E2170FEF3904&rk3s=8e244e95&rrcfp=f06b921b&x-expires=1766227893&x-signature=s%2FlQOMwaoI%2FowcXLDaxkiQRWJQM%3D"
            },
            "李四": {
                "phone": "13900139000",
                "name": "李四",
                "type": "培训结业证书",
                "date": "2025年5月20日",
                "number": "Cert20250520002",
                "image": "https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/94ca4d9bfee54e1a83d249c5000609a8~tplv-a9rns2rl98-image.image?rcl=202511201851033C72AAF7E2170FEF3904&rk3s=8e244e95&rrcfp=f06b921b&x-expires=1766227893&x-signature=s%2FlQOMwaoI%2FowcXLDaxkiQRWJQM%3D"
            }
        };

        // DOM 元素
        const queryForm = document.getElementById('queryForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const phoneError = document.getElementById('phoneError');
        const queryBtn = document.getElementById('queryBtn');
        const noCertificateSection = document.getElementById('noCertificateSection');
        const retryBtn = document.getElementById('retryBtn');

        // 手机号验证
        function validatePhone() {
            const phoneValue = phoneInput.value.trim();
            const phonePattern = /^1[3-9]\d{9}$/;
            
            if (phoneValue && !phonePattern.test(phoneValue)) {
                phoneError.classList.remove('hidden');
                phoneInput.classList.add('border-red-500');
                return false;
            } else {
                phoneError.classList.add('hidden');
                phoneInput.classList.remove('border-red-500');
                return true;
            }
        }
        
        // 实时验证
        phoneInput.addEventListener('input', function() {
            validatePhone();
        });

        // 查询表单提交
        queryForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            
            // 表单验证
            if (!name || !phone) {
                alert('请填写完整的查询信息');
                return;
            }
            
            // 验证手机号格式
            if (!validatePhone()) {
                return;
            }
            
            // 模拟查询证书
            queryCertificate(name, phone);
        });

        // 模拟查询证书
        function queryCertificate(name, phone) {
            // 显示加载状态
            queryBtn.disabled = true;
            queryBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 查询中...';
            
            // 模拟异步请求
            setTimeout(function() {
                // 恢复按钮状态
                queryBtn.disabled = false;
                queryBtn.innerHTML = '<i class="fa fa-search mr-2"></i> 查看证书';
                
                // 检查是否有匹配的证书
                if (certificateData[name] && certificateData[name].phone === phone) {
                    // 获取证书数据
                    const certData = certificateData[name];
                    
                    // 跳转到证书详情页面，并传递证书信息
                    window.location.href = `certificate-detail.html?name=${encodeURIComponent(certData.name)}&type=${encodeURIComponent(certData.type)}&date=${encodeURIComponent(certData.date)}&number=${encodeURIComponent(certData.number)}&image=${encodeURIComponent(certData.image)}`;
                } else {
                    // 显示无证书提示
                    showNoCertificate();
                    
                    // 滚动到结果区域
                    setTimeout(function() {
                        noCertificateSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                }
            }, 1500);
        }



        // 显示无证书提示
        function showNoCertificate() {
            // 隐藏证书区域，显示无证书提示
            certificateSection.classList.add('hidden');
            noCertificateSection.classList.remove('hidden');
        }

        // 下载证书
        downloadBtn.addEventListener('click', function() {
            // 模拟下载
            this.disabled = true;
            this.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 下载中...';
            
            setTimeout(() => {
                // 创建一个虚拟的下载链接
                const link = document.createElement('a');
                link.href = certificateImage.src;
                link.download = `${certName.textContent}_${certType.textContent}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 恢复按钮状态
                this.disabled = false;
                this.innerHTML = '<i class="fa fa-download mr-2"></i> 下载证书';
                
                // 显示下载成功提示
                alert('证书下载成功');
            }, 1000);
        });

        // 打印证书
        printBtn.addEventListener('click', function() {
            // 打开证书放大模态框
            certificateModal.classList.remove('hidden');
            
            // 延迟执行打印，确保图片已加载
            setTimeout(() => {
                // 调用浏览器打印功能
                window.print();
                
                // 关闭模态框
                certificateModal.classList.add('hidden');
            }, 500);
        });

        // 重新查询
        retryBtn.addEventListener('click', function() {
            // 重置表单
            queryForm.reset();
            phoneError.classList.add('hidden');
            phoneInput.classList.remove('border-red-500');
            
            // 隐藏无证书提示
            noCertificateSection.classList.add('hidden');
            
            // 滚动到表单区域
            queryForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // 打开证书放大模态框
        certificateInner.addEventListener('click', function() {
            certificateModal.classList.remove('hidden');
        });

        // 关闭证书放大模态框
        closeModal.addEventListener('click', function() {
            certificateModal.classList.add('hidden');
        });

        // 点击模态框背景关闭
        certificateModal.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.add('hidden');
            }
        });

        // 键盘 ESC 关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !certificateModal.classList.contains('hidden')) {
                certificateModal.classList.add('hidden');
            }
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
